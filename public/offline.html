<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#635bda">
  <title>오프라인 · CSDemoApp</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8fc;color:#242638;font-family:"Segoe UI",system-ui,sans-serif}main{max-width:480px;text-align:center;background:#fff;border:1px solid #e3e4ee;border-radius:18px;padding:40px 28px}.logo{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#635bda;color:white;font-size:28px;font-weight:700}h1{font-size:24px;margin-top:24px}p{color:#67677e;line-height:1.8}button{border:0;border-radius:8px;background:#635bda;color:#fff;padding:12px 22px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #b2abff;outline-offset:3px}
  </style>
</head>
<body><main><span class="logo" aria-hidden="true">C</span><h1>인터넷 연결을 확인해 주세요</h1><p>현재 페이지에 연결할 수 없습니다.<br>에이전트와 대화하려면 인터넷 연결이 필요합니다.<br>연결이 복구되면 다시 시도해 주세요.</p><button type="button" onclick="location.reload()">다시 시도</button></main></body>
</html>
